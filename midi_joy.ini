[midi]
; port name or part of it (see --list); omit for the system default port
port = MIDI Mix
; 1-16; omit to accept any channel
; channel = 1

[vjoy]
device = 1
; smoothing time constant in seconds, 0 = off
smooth = 0.1

; vjoy axis = midi cc number (find it with --monitor)
; axes: x y z rx ry rz sl0 sl1 (each must be enabled in Configure vJoy)
[axes]
z = 62
rx = 58
ry = 59
rz = 61

; vjoy button (1-128) = note N or cc N, as printed by --monitor (cc >= 64 counts as pressed)
; device must have that many buttons in Configure vJoy
[buttons]
; 1 = note 1
1 = note 22
2 = note 24
3 = note 27

; DCS-BIOS: [dcsbios:AIRCRAFT], AIRCRAFT = json name in Saved Games\DCS\Scripts\DCS-BIOS\doc\json (one section only)
; IDENTIFIER (look it up in Bort) = cc N; knob travel split into equal zones, one per switch position
; IDENTIFIER = note N (switches of up to 5 positions); each press steps one position up, wrapping
; top -> bottom (3-position: mid -> up -> down). Button LED shows the position DCS reports, counted
; from the top: solid, dark, slow blink, fast blink, double flash; all dark at mission end or with
; no aircraft (needs [midi] port)
[dcsbios:F-16C_50]
ANTI_COLL_LIGHT_KNB = cc 17
MASTER_LIGHT_SW = cc 16
AP_PITCH_SW = note 19
AP_ROLL_SW = note 21
RF_SW = note 16
LASER_ARM_SW = note 18

; click when a knob (cc N above) moves a switch to another position; dials stay silent
[sound]
; wav file, or folder = random wav per click (16-bit PCM), relative to this file; omit = silent
click = resources/sfx-click
; 0.0-1.0
volume = 0.2
