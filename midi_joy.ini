[midi]
; port name or part of it (see --list); omit for the system default port
port = MIDI Mix
; 1-16; omit to accept any channel
; channel = 1
; seconds a button is held for a long press, on 'hold' switches in [dcsbios:AIRCRAFT]
hold_s = 0.5

[vjoy]
device = 1
; smoothing time constant in seconds, 0 = off
smooth = 0.1

; vjoy axis = midi cc number (find it with --monitor)
; axes: x y z rx ry rz sl0 sl1 (each must be enabled in Configure vJoy)
[axes]
; z = 62
; rx = 58
; ry = 59
; rz = 61

; vjoy button (1-128) = note:N or cc:N, as printed by --monitor (cc >= 64 counts as pressed)
; device must have that many buttons in Configure vJoy
[buttons]
; 1 = note:1
; 1 = note:22
; 2 = note:24
3 = note:27

; DCS-BIOS: [dcsbios:AIRCRAFT], AIRCRAFT = json name in Saved Games\DCS\Scripts\DCS-BIOS\doc\json (one section only)
; IDENTIFIER (look it up in Bort) = cc:N; knob travel split into equal zones, one per switch position
; IDENTIFIER = note:N (switches of up to 5 positions); each press steps one position, turning around
; at the ends (3-position: mid -> up -> mid -> down -> mid). Button LED shows the position DCS reports, counted
; from the top: solid, dark, slow blink, fast blink, double flash; all dark at mission end, with
; no aircraft or after 3 s without DCS-BIOS data (needs [midi] port)
; IDENTIFIER = note:N hold off:OFF (3-position switches, args in any order): OFF = off position, 0 (bottom) to 2, omitted = 1 (middle).
; Held for [midi] hold_s goes to OFF, a short press flips between the other two (from OFF to the upper one).
; Moves one position at a time like the real switch, so up -> down passes the middle. LED dark in OFF,
; solid in the upper, slow blink in the lower position
; dark:N on any note:N switch: position N (0 = bottom) gets the dark LED, the others keep their order from
; the top, e.g. 3-position dark:2: top dark, middle solid, bottom slow blink
[dcsbios:F-16C_50]
ANTI_COLL_LIGHT_KNB = cc:17
MASTER_LIGHT_SW = cc:16
AP_PITCH_SW = note:19 hold
AP_ROLL_SW = note:21 hold
RF_SW = note:16
LASER_ARM_SW = note:18
MASTER_ARM_SW = note:13 hold off:0 dark:0
RWR_PWR_BTN = note:15
MASTER_CAUTION = note:25
ICP_HUD_BRT_KNB = cc:58
HMCS_INT_KNB = cc:59
ECM_PW_SW = note:1 hold off:0
ECM_XMIT_SW = note:3
CMDS_CH_EXP_CAT_SW = note:4
CMDS_FL_EXP_CAT_SW = note:6
CMDS_MODE_KNB = cc:22
CMDS_PROG_KNB = cc:18
ANTI_SKID_SW = note:22 hold off:0 dark:1
LAND_TAXI_LIGHT_SW = note:24 hold
UHF_FUNC_KNB = cc:54
IFF_MASTER_KNB = cc:55

; wav file, or folder = random wav each time (16 or 24-bit PCM), relative to this file; omit = silent
[sound]
; when a knob (cc:N above) moves a switch to another position; dials stay silent
knob = resources/sfx-knob
; 0.0-1.0
knob_volume = 0.2
; on every switch press (note:N above)
switch = resources/sfx-switch
switch_volume = 0.2

; on-screen text when a knob above moves a DCS-BIOS control (position sent), after a note press (position
; DCS reports within 1 s), and when DCS-BIOS (dis)connects (with note switches only, they read its data);
; DCS changing switches on its own doesn't show; needs DCS in borderless mode
; (Full Screen off), primary monitor only; omit the section = off
[overlay]
; N NE E SE S SW W NW or C (center)
position = N
; pixels, + = right / down, e.g. SW with a 20 px margin: offset_x = 20, offset_y = -20
offset_x = 0
offset_y = 60
timeout_s = 1.5
