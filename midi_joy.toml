# options and syntax: README.md

[midi]
hold_s = 0.5

[midi."MIDI Mix"]
# channel = 1

# [midi."LPProMK3"]
# # channel = 0

[midi.lpp_mfd_left]
port = "LPProMK3"
channel = 1

[midi.lpp_mfd_right]
port = "LPProMK3"
channel = 2

[vjoy]
device = 1
smooth = 0.1

[vjoy.axes."MIDI Mix"]
# z = 62
# rx = 58
# ry = 59
rz = 61

[vjoy.buttons."MIDI Mix"]
# 1 = { note = 1 }
# 1 = { note = 22 }
# 2 = { note = 24 }
3 = { note = 27 }

